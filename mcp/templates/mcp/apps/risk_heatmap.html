{% extends "mcp/apps/_base.html" %}
{% load i18n %}
{% block title %}{% trans "Risk heat map" %}{% endblock %}
{% block style %}
<style>
  .grid { display: grid; gap: 4px; align-items: stretch; }
  .axis { color: var(--app-muted); font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .cell { min-height: 44px; border-radius: 6px; border: 1px solid var(--app-border); display: flex; flex-direction: column;
          align-items: center; justify-content: center; padding: 4px; font-weight: 700; background: var(--app-empty); }
  .cell .names { font-weight: 400; font-size: 11px; text-align: center; overflow-wrap: anywhere; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; color: var(--app-muted); font-size: 12px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; border: 1px solid var(--app-border); }
  .note { color: var(--app-muted); font-size: 12px; margin-top: 12px; }
</style>
{% endblock %}
{% block script %}
<script>
(function () {
  "use strict";
  var text = {
    title: "{{ _('Risk heat map')|escapejs }}",
    likelihood: "{{ _('Likelihood')|escapejs }}",
    impact: "{{ _('Impact')|escapejs }}",
    rated: "{{ _('rated risks')|escapejs }}",
    unrated: "{{ _('not yet rated')|escapejs }}",
    stages: {
      initial: "{{ _('Initial rating')|escapejs }}",
      current: "{{ _('Current rating')|escapejs }}",
      residual: "{{ _('Residual rating')|escapejs }}"
    },
    none: "{{ _('No risk is rated at this stage within your scopes.')|escapejs }}",
    mixed: "{{ _('These risks follow several risk criteria : the cells show their number only.')|escapejs }}",
    failed: "{{ _('The tool did not return a heat map.')|escapejs }}"
  };
  // A level is named and coloured by the risk criteria of Cairn, never here.
  var HEX = /^#[0-9a-fA-F]{6}$/;
  function paint(node, level) {
    if (level && HEX.test(level.color || "")) {
      node.style.background = level.color;
      if (HEX.test(level.text_color || "")) { node.style.color = level.text_color; }
    }
  }
  window.cairnRender = function (root, data) {
    var el = window.cairnEl;
    root.textContent = "";
    if (!data || !data.cells) { root.appendChild(el("p", "empty", text.failed)); return; }
    var heading = data.assessment ? data.assessment.reference + " : " + data.assessment.name : text.title;
    root.appendChild(el("h1", "", heading));
    root.appendChild(el("p", "sub", (text.stages[data.stage] || "") + " · " + data.rated + " " + text.rated +
      (data.unrated ? " · " + data.unrated + " " + text.unrated : "")));
    if (!data.rated) { root.appendChild(el("p", "empty", text.none)); return; }
    var lookup = {}, levels = new Map();
    data.cells.forEach(function (cell) { lookup[cell.likelihood + ":" + cell.impact] = cell; });
    (data.levels || []).forEach(function (level) { levels.set(level.level, level); });
    var grid = el("div", "grid");
    grid.setAttribute("role", "table");
    grid.setAttribute("aria-label", text.title);
    grid.style.gridTemplateColumns = "auto repeat(" + data.impact_max + ", minmax(40px, 1fr))";
    for (var l = data.likelihood_max; l >= 1; l--) {
      grid.appendChild(el("div", "axis", l));
      for (var i = 1; i <= data.impact_max; i++) {
        var cell = lookup[l + ":" + i];
        var level = cell ? levels.get(cell.level) : null;
        var box = el("div", "cell");
        box.setAttribute("role", "cell");
        box.setAttribute("aria-label", text.likelihood + " " + l + ", " + text.impact + " " + i + " : " +
          (cell ? cell.count : 0) + (level ? " (" + level.name + ")" : ""));
        if (cell) {
          paint(box, level);
          box.appendChild(el("span", "", cell.count));
          box.appendChild(el("span", "names", cell.risks.map(function (r) { return r.reference; }).join(", ")));
        }
        grid.appendChild(box);
      }
    }
    grid.appendChild(el("div", "axis", ""));
    for (var j = 1; j <= data.impact_max; j++) { grid.appendChild(el("div", "axis", j)); }
    root.appendChild(grid);
    root.appendChild(el("p", "sub", "↑ " + text.likelihood + " · " + text.impact + " →"));
    if (data.mixed_criteria) { root.appendChild(el("p", "note", text.mixed)); }
    var legend = el("div", "legend");
    (data.levels || []).forEach(function (level) {
      var item = el("span", "");
      var swatch = el("span", "swatch");
      paint(swatch, level);
      item.appendChild(swatch);
      item.appendChild(document.createTextNode(level.name));
      legend.appendChild(item);
    });
    if (legend.childNodes.length) { root.appendChild(legend); }
  };
})();
</script>
{% endblock %}
