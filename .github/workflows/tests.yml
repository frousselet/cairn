name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Manual run on any branch : "Run workflow" in the Actions tab, or
  # `gh workflow run tests.yml --ref <branch>`. It runs both jobs.
  workflow_dispatch:

permissions:
  contents: read

# The settings refuse to load outside DEBUG with the public placeholder key.
# The jobs run with DEBUG off, like production, so they bring a key of their own.
env:
  SECRET_KEY: ci-only-key-never-used-by-a-running-instance

jobs:
  # Fast run : in-memory SQLite, schema built from the models. Lint, coverage
  # and the whole suite, including the interface sweep on the demo dataset.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile translations
        run: python manage.py compilemessages

      - name: Run tests
        run: pytest -x -v --tb=short --cov --cov-report=term-missing

  # Same suite on the production engine (the major the compose file ships),
  # with every migration replayed from the first one. The fast run above never
  # executes a migration and never meets PostgreSQL : a migration that fails, a
  # model changed without its migration, or a query SQLite tolerates and
  # PostgreSQL refuses would otherwise be discovered on a deployment.
  #
  # It takes about twelve minutes, so it does not run on every pull request :
  # always on `main`, and on a pull request only when asked for, either by
  # giving the pull request the `ci:postgres` label (it then runs on each push
  # to it) or by a manual run of this workflow on the branch. Ask for it when
  # a change touches a migration, a raw query, or anything that groups, orders
  # or compares in the database.
  test-postgres:
    name: test (PostgreSQL, migrations)
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'ci:postgres')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cairn
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: core.settings_test_postgres
      # The backup and restore tests need pg_dump, pg_restore and psql : with
      # this set, missing tools fail the job instead of skipping the tests.
      REQUIRE_BACKUP_TOOLS: "1"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cairn
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # `manage.py backup` and `restore` drive pg_dump, pg_restore and psql,
      # which must be of the server's major : the runner ships an older one.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile translations
        run: python manage.py compilemessages

      # A model changed without its migration passes every test (the schema
      # is built from the models) and breaks the first deployment.
      - name: Models and migrations are in sync
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests on PostgreSQL
        run: pytest --ds=core.settings_test_postgres -x --tb=short

  # What only a browser can tell : the contrast a text really has once the
  # cascade and the theme are applied, the name of a control drawn by a script,
  # the size of a target, and whether the page works under its Content
  # Security Policy. A demo instance is built by the real migrations on
  # PostgreSQL, seeded and served, and every page of the screenshot set is
  # audited in the light and the dark theme : any WCAG 2.2 A or AA violation,
  # any policy violation and any script error fail the job
  # (docs/technical/testing.md).
  #
  # The instance is migrated, not built from the models : the help content,
  # the default lifecycles and the reference data come from data migrations,
  # and a page audited without them is not the page a deployment serves.
  accessibility:
    name: accessibility (axe-core, both themes)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cairn
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: core.settings_local
      LOCAL_POSTGRES: "1"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cairn
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      # A development tool, never served : pinned here rather than vendored.
      AXE_CORE_VERSION: 4.10.3

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch axe-core
        working-directory: ${{ runner.temp }}
        run: |
          npm pack "axe-core@${AXE_CORE_VERSION}" --silent
          tar -xzf "axe-core-${AXE_CORE_VERSION}.tgz" package/axe.min.js

      # Replaying the migrations takes about seven minutes, and their result
      # only changes when a migration does : the migrated, still empty
      # database is kept as a dump, keyed on the content of every migration
      # file. A hit restores it in seconds; `migrate` then runs anyway, finds
      # nothing to apply and fires the post-migrate hooks.
      - name: Look for the migrated database in the cache
        id: migrated
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/migrated.pgdump
          key: migrated-postgres18-${{ hashFiles('**/migrations/*.py') }}

      # pg_dump and pg_restore are run inside the service container : they are
      # of the server's own version, which the runner's are not.
      - name: Migrate and seed a demo instance
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          if [ "${{ steps.migrated.outputs.cache-hit }}" = "true" ]; then
            docker exec -i "$POSTGRES_CONTAINER" pg_restore --no-owner --exit-on-error -U cairn -d cairn < "${RUNNER_TEMP}/migrated.pgdump"
          fi
          python manage.py migrate --noinput
          if [ "${{ steps.migrated.outputs.cache-hit }}" != "true" ]; then
            docker exec "$POSTGRES_CONTAINER" pg_dump -U cairn --format=custom cairn > "${RUNNER_TEMP}/migrated.pgdump"
          fi
          python manage.py shell -c "exec(open('scripts/seed_demo_data.py').read())"

      - name: Serve it
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > "${RUNNER_TEMP}/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl --silent --fail --output /dev/null http://127.0.0.1:8000/health/ && exit 0
            sleep 1
          done
          cat "${RUNNER_TEMP}/server.log"
          exit 1

      # On main and on a manual run, every other kind of page too (--crawl,
      # core/crawl.py) : some 340 more in each theme, about twenty-five
      # minutes that each push of a pull request is spared.
      - name: Audit every page with axe-core
        env:
          CRAWL: ${{ github.event_name != 'pull_request' && '--crawl' || '' }}
        run: python scripts/a11y_audit.py --base-url http://127.0.0.1:8000 --axe "${RUNNER_TEMP}/package/axe.min.js" $CRAWL

      - name: Server log
        if: failure()
        run: tail -n 100 "${RUNNER_TEMP}/server.log"
