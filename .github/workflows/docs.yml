name: Documentation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The generated reference is rendered from the code's own registries, so a
      # new permission, lifecycle step, widget, MCP tool or endpoint that has
      # not been regenerated fails here rather than shipping a stale reference.
      - name: Reference documentation is up to date
        run: python manage.py generate_docs --check --settings=core.settings_test

      # The wiki has no directories: a link to one, or to a file that does not
      # exist, cannot be published. Catching it here rather than on release day
      # is the whole point of running the builder in dry-run mode.
      - name: Documentation links resolve
        run: python scripts/build_wiki.py --check

  publish:
    name: Publish to the wiki
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the wiki
        run: python scripts/build_wiki.py --out build/wiki --version "${GITHUB_REF_NAME}"

      # A wiki lives in its own <repo>.wiki.git repository, which GitHub gates
      # differently from the code: GITHUB_TOKEN generally cannot write to it,
      # and fine-grained PATs have no wiki permission at all. That leaves two
      # credentials, and they are not equivalent:
      #
      #   - a classic PAT with the `repo` scope, which grants write access to
      #     EVERY repository the account owns. Stored here, any workflow in this
      #     repository could read it and use it against all the others;
      #   - a deploy key, which is attached to this repository alone and cannot
      #     reach anything else. It does carry write access to the wiki, which
      #     is exactly the access this job needs and nothing more.
      #
      # The deploy key is the one we use. Setting it up is in
      # docs/technical/release-process.md.
      - name: Push to the wiki
        env:
          WIKI_DEPLOY_KEY: ${{ secrets.WIKI_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          remediation() {
            echo "::error title=Wiki publication failed::Set a WIKI_DEPLOY_KEY secret."
            echo ""
            echo "The wiki is a separate git repository and needs its own credential."
            echo "Use a deploy key, which is scoped to this repository alone:"
            echo ""
            echo "  ssh-keygen -t ed25519 -N '' -C cairn-wiki -f /tmp/cairn-wiki"
            echo "  gh repo deploy-key add /tmp/cairn-wiki.pub --title 'Wiki publication' --allow-write"
            echo "  gh secret set WIKI_DEPLOY_KEY < /tmp/cairn-wiki"
            echo "  shred -u /tmp/cairn-wiki /tmp/cairn-wiki.pub"
            echo ""
            echo "Do NOT use a classic personal access token here: its 'repo' scope"
            echo "would grant this workflow write access to every repository you own."
            echo ""
            echo "The wiki can also be published by hand meanwhile:"
            echo "  python scripts/build_wiki.py --out build/wiki --version <tag>"
          }

          if [ -z "${WIKI_DEPLOY_KEY}" ]; then
            remediation
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${WIKI_DEPLOY_KEY}" > ~/.ssh/wiki_key
          chmod 600 ~/.ssh/wiki_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/wiki_key -o IdentitiesOnly=yes"

          if ! git clone "git@github.com:${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "Could not clone ${GITHUB_REPOSITORY}.wiki.git."
            echo "Either the deploy key is not installed with write access, or the wiki"
            echo "has never been initialised (create its first page once at"
            echo "https://github.com/${GITHUB_REPOSITORY}/wiki)."
            remediation
            exit 1
          fi

          # Replace the published set wholesale rather than merging: the wiki is
          # a rendering of docs/, so a page deleted at the source must disappear
          # here too instead of lingering for ever.
          find wiki -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -R build/wiki/. wiki/

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches docs/ at ${GITHUB_REF_NAME}; nothing to push."
            exit 0
          fi
          git commit -m "Publish documentation for ${GITHUB_REF_NAME}"
          if ! git push; then
            remediation
            exit 1
          fi
          echo "Published $(find . -name '*.md' -not -path './.git/*' | wc -l) pages to the wiki."
