[pytest]
DJANGO_SETTINGS_MODULE = core.settings_test
python_files = tests.py test_*.py *_tests.py
asyncio_default_fixture_loop_scope = function
# Two warnings are defects, not noise, and fail the suite :
# - an API list paginated without a total order repeats and skips rows;
# - a date-time compared with a naive value is read in the wrong time zone.
# FORMS_URLFIELD_ASSUME_HTTPS is a transitional setting of the Django 5.2 LTS
# line, set on purpose (see core/settings.py) : its own deprecation notice is
# acknowledged.
filterwarnings =
    error::django.core.paginator.UnorderedObjectListWarning
    error:DateTimeField .* received a naive datetime:RuntimeWarning
    ignore:The FORMS_URLFIELD_ASSUME_HTTPS transitional setting is deprecated
markers =
    sweep: crawl of the whole interface on the demo dataset (about a minute); deselect with -m "not sweep"
