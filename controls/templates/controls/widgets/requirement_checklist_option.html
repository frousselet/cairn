<div class="form-check">
  <input type="checkbox" name="{{ widget.name }}" value="{{ widget.value|stringformat:'s' }}" class="form-check-input" id="{{ widget.attrs.id }}"{% if widget.attrs.checked %} checked{% endif %}{% if widget.attrs.disabled %} disabled{% endif %}>
  <label class="form-check-label text-sm" for="{{ widget.attrs.id }}">{{ widget.label }}</label>
</div>
