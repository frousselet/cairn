{% extends "includes/page_form.html" %}

{% block extra_js %}
{% include "includes/image_resize.html" %}
<script>
(function() {
  var avatarInput = document.getElementById('id_avatar');
  if (!avatarInput) return;
  avatarInput.addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    resizeImageFile(file, 128, function(dataUri) {
      var hidden = document.getElementById('id_avatar_resized');
      if (hidden) hidden.value = dataUri;
    });
  });
})();
</script>
{% endblock %}
