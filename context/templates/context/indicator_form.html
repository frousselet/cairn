{% extends "includes/page_form.html" %}

{% block page_form_extra %}
{% comment %}
  A boolean indicator has no unit and no numeric threshold : hide those
  fields (and clear them) when the format is boolean, and only offer the
  threshold operators that match the format.
{% endcomment %}
<script>
(function() {
  var formatSelect = document.getElementById('id_format');
  if (!formatSelect) return;
  function wrapper(id) {
    var input = document.getElementById(id);
    return input ? input.closest('.mb-3') : null;
  }
  var operatorSelect = document.getElementById('id_critical_threshold_operator');
  var numericFields = ['id_unit', 'id_critical_threshold_value', 'id_critical_threshold_min', 'id_critical_threshold_max'];

  function updateFields() {
    var isBoolean = (formatSelect.value === 'boolean');
    numericFields.forEach(function(id) {
      var box = wrapper(id);
      if (!box) return;
      box.hidden = isBoolean;
      if (isBoolean) document.getElementById(id).value = '';
    });
    if (operatorSelect) {
      Array.from(operatorSelect.options).forEach(function(opt) {
        if (!opt.value) return;
        var allowed = isBoolean ? (opt.value === 'is_true' || opt.value === 'is_false') : (opt.value === 'below' || opt.value === 'above');
        opt.hidden = !allowed;
        opt.disabled = !allowed;
      });
      var selected = operatorSelect.options[operatorSelect.selectedIndex];
      if (selected && selected.disabled) operatorSelect.value = '';
    }
  }

  formatSelect.addEventListener('change', updateFields);
  updateFields();
})();
</script>
{% endblock %}
